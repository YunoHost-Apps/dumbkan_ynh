#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dumbkan"
name = "DumbKan"
description.en = "Dumb Kanban"
description.fr = "Kanban simple"

version = "2025.06.24~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "GPL-3.0"
website = "https://www.dumbware.io/"
admindoc = "https://www.dumbware.io/DumbKan"
code = "https://github.com/DumbWareio/DumbKan"
fund = "https://buymeacoffee.com/dumbware"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "200M"
ram.build = "200M"
ram.runtime = "70M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/dumbkan"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/DumbWareio/DumbKan/archive/a1dc943e6b259fc0cccd1456233268ca9f40122a.tar.gz"
    sha256 = "1ce920229dcfaa091d54c1e9d11b76087805fa11b05f07004406d653d5039454"
    autoupdate.upstream = "https://github.com/DumbWareio/DumbKan"
    autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.nodejs]
    version = "22"
